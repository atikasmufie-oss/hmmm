<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Selamat Datang Kembali</h2>
                <p>Sign in ke Akun Anda</p>
            </div>
            
            <form id="loginForm">
                <h3>Silahkan Login</h3>
                <label for="username">Nama Pengguna</label>
                <input type="text" id="username" placeholder="Nama Pengguna .." required="required">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password .." required="required">
                <!-- <p id="message"></p> -->
                <button type="submit">masuk</button>

                <div class="social">
                    <div class="go"><a href="register.html">DAFTAR</a></div>
                    <div class="kanan"><i class="fab fa-google"></i> Google</div>
                </div>
                <button onclick="location.href='../index.html';">Home</button>
                <div id="alertBox" class="alert" style="display:none;"></div>
            </form>
<script src="js/login.js"></script>
</body>
</html>
